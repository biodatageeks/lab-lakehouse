[project]
name = "lab-lakehouse-snowflake"
version = "0.1.0"
description = "Lakehouse course on a Snowflake trial: notebooks + headless feature test-suite"
requires-python = ">=3.12"
dependencies = [
    "snowflake-connector-python>=3.12",
    "pytest>=8",
    "python-dotenv>=1",
    "cryptography>=50.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"
