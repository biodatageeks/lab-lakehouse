[project]
name = "lab-lakehouse-survey"
version = "0.1.0"
description = "Trainer test-suite for the Stack Overflow survey lakehouse lab (Databricks Free Edition)"
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.117.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"

[tool.uv]
package = false
