[project]
name = "lab-lakehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.117.0",
    "databricks-sql-connector>=4.4.0",
    "dbt-databricks>=1.13.0",
    "delta-sharing>=1.4.1",
    "deltalake>=1.6.6",
    "duckdb>=2.0.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pyiceberg[pyarrow]>=0.12.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.uv]
package = false
